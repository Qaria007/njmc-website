name: Sync articles from the weekly writer

# The "NJMC weekly Insights article" routine keeps publishing into Qaria007/njmc-site-public
# (its gates and pipeline are unchanged). This job pulls that repo every day, re-runs
# scripts/import-old-site.py (same BRAND.md corrections), and when anything changed it
# checks, commits and ships a new image. The server picks the image up by itself
# (/opt/njmc/autodeploy.sh). A push made with GITHUB_TOKEN does not start ci.yml, so the
# checks and the image build run here.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-articles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Qaria007/njmc-site-public
          path: old-site
      - name: Import
        run: OLD_SITE_DIR="$GITHUB_WORKSPACE/old-site" python3 scripts/import-old-site.py > /dev/null
      - name: Anything new?
        id: diff
        run: |
          if [ -n "$(git status --porcelain src/content)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; git status --porcelain src/content; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Checks
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test
          npm run claims-lint
          DATABASE_URI=postgres://build:build@localhost:5432/build PAYLOAD_SECRET=build-time-placeholder npm run build
      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "njmc-article-sync"
          git config user.email "actions@users.noreply.github.com"
          git add src/content
          git commit -m "Sync articles from the weekly writer ($(date -u +%F))"
          git push
      - uses: docker/setup-buildx-action@v3
        if: steps.diff.outputs.changed == 'true'
      - uses: docker/login-action@v3
        if: steps.diff.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.diff.outputs.changed == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/qaria007/njmc-website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Tell Bing (and the other IndexNow engines) about the new or changed articles, once the
      # server has picked up the new image (autodeploy every 10 min). Added 16 Oct 2026: Bing had
      # no NJMC pages. Never fails the job.
      - name: IndexNow (new and changed articles)
        if: steps.diff.outputs.changed == 'true'
        run: |
          URLS=$(git diff --name-only HEAD~1 HEAD -- src/content | sed -n -E \
            -e 's#^src/content/en/insights__(.+)\.json$#https://njmcmedicsupp.com/insights/\1/#p' \
            -e 's#^src/content/ar/insights__(.+)\.json$#https://njmcmedicsupp.com/ar/insights/\1/#p' \
            -e 's#^src/content/en/insights\.json$#https://njmcmedicsupp.com/insights/#p' \
            -e 's#^src/content/ar/insights\.json$#https://njmcmedicsupp.com/ar/insights/#p')
          if [ -z "$URLS" ]; then echo "no article URLs changed"; exit 0; fi
          FIRST=$(echo "$URLS" | head -1)
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$FIRST")" = 200 ] && break
            sleep 30
          done
          echo "$URLS" | xargs python3 scripts/indexnow.py || echo "IndexNow failed (not fatal)"
